services:

  # ── Infrastructure ───────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: cloudmart-postgres
    environment:
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart123
      POSTGRES_DB: cloudmart_users
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmart -d cloudmart_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: cloudmart-mongo
    environment:
      MONGO_INITDB_DATABASE: cloudmart_products
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cloudmart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cloudmart
      RABBITMQ_DEFAULT_PASS: cloudmart123
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservices ────────────────────────────────────────────

  eureka:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    container_name: cloudmart-eureka
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: cloudmart-gateway
    ports:
      - "8090:8090"
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xms64m"
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --server-response -q --spider http://localhost:8090/ 2>&1 | grep -q 'HTTP/'"]
      interval: 15s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: cloudmart-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudmart_users
      SPRING_DATASOURCE_USERNAME: cloudmart
      SPRING_DATASOURCE_PASSWORD: cloudmart123
      EUREKA_URL: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy

  product-service:
    build:
      context: ../product-service
      dockerfile: Dockerfile
    container_name: cloudmart-product
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/cloudmart_products
      EUREKA_URL: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      eureka:
        condition: service_healthy

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    container_name: cloudmart-order
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudmart_users
      SPRING_DATASOURCE_USERNAME: cloudmart
      SPRING_DATASOURCE_PASSWORD: cloudmart123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: cloudmart
      SPRING_RABBITMQ_PASSWORD: cloudmart123
      EUREKA_URL: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: cloudmart-notification
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: cloudmart
      SPRING_RABBITMQ_PASSWORD: cloudmart123
      EUREKA_URL: http://eureka:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cloudmart-frontend
    ports:
      - "4200:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  mongo_data: